name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ohne eigene Domain liegt die Seite unter github.io/<repo>/ und wird mit diesem Unterpfad gebaut.
      # Mit eigener Domain (Variable CUSTOM_DOMAIN=true unter Settings → Variables) wird ohne Unterpfad gebaut.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN == 'true' && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: ${{ vars.CUSTOM_DOMAIN == 'true' && 'https://www.philosophiederneuenzeit.de' || format('https://{0}.github.io', github.repository_owner) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
